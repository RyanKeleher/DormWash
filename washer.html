<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DormWash · Washer #1</title>
  <!-- Web version of WasherTimerView.swift (washer screen + Report a Problem form) -->
  <style>
    :root {
      --bg: #f2f2f7; --card: #ffffff; --machine: #e5e5ea; --text: #111114; --muted: #6e6e73;
      --line: #d1d1d6; --purple: #8e44ec; --purple-bg: rgba(142, 68, 236, .10);
      --green: #34c759; --red: #ff3b30; --blue: #007aff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000; --card: #1c1c1e; --machine: #2c2c2e; --text: #f5f5f7; --muted: #98989f;
        --line: #38383a; --purple: #bf8cff; --purple-bg: rgba(191, 140, 255, .14);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 48px 16px;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }

    /* ----- The washer ----- */
    .washer {
      width: 280px; height: 280px; border-radius: 30px; background: var(--machine);
      box-shadow: 0 4px 12px rgba(0,0,0,.18); position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .door { position: absolute; width: 215px; height: 215px; border-radius: 50%;
      border: 15px solid rgba(255,59,48,.5); }
    .glass { position: absolute; width: 190px; height: 190px; border-radius: 50%; background: rgba(0,0,0,.1); }
    .water { position: absolute; width: 172px; height: 172px; animation: spin 1.5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .readout { position: relative; text-align: center; }
    .time { font: 700 42px/1 ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
    .ai-tag { color: var(--purple); font-size: 12px; font-weight: 700; margin-top: 6px; visibility: hidden; }
    .ai-on .ai-tag { visibility: visible; }

    /* ----- Smart Cycle Prediction card ----- */
    .panel { width: 100%; max-width: 340px; background: var(--purple-bg); border-radius: 15px; padding: 16px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .toggle-row label { font-weight: 600; font-size: 17px; }
    .note { color: var(--muted); font-size: 13px; line-height: 1.35; margin: 10px 0 0; }
    .switch { appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--line);
      position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0; margin: 0; }
    .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px;
      border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .2s; }
    .switch:checked { background: var(--green); }
    .switch:checked::after { transform: translateX(20px); }

    /* ----- Buttons ----- */
    .btn { width: 100%; max-width: 340px; border: 0; border-radius: 12px; padding: 14px;
      font: 600 17px/1 inherit; font-family: inherit; color: #fff; cursor: pointer; }
    .btn-red { background: var(--red); }
    .btn:active { opacity: .8; }

    /* ----- Report a Problem sheet ----- */
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; }
    .backdrop.open { display: flex; }
    .sheet { width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; background: var(--bg);
      border-radius: 14px 14px 0 0; padding: 12px 16px 32px; animation: up .25s ease-out; }
    @keyframes up { from { transform: translateY(100%); } }
    .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .sheet h2 { margin: 0; font-size: 28px; font-weight: 700; }
    .cancel { background: none; border: 0; color: var(--blue); font: inherit; font-size: 17px; cursor: pointer; padding: 0; }
    .section-label { color: var(--muted); font-size: 13px; text-transform: uppercase; margin: 22px 0 6px 16px; }
    .group { background: var(--card); border-radius: 10px; padding: 12px 16px; }
    .group select, .group textarea { width: 100%; border: 0; background: transparent; color: var(--text);
      font: inherit; font-size: 17px; outline: none; }
    .group textarea { resize: none; min-height: 78px; }
    .count { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
    .send { display: block; width: 100%; margin-top: 22px; background: var(--card); color: var(--blue); border: 0;
      border-radius: 10px; padding: 14px; font: inherit; font-size: 17px; cursor: pointer; }
    .alert { margin-top: 14px; text-align: center; font-size: 15px; min-height: 20px; }
    .alert.ok { color: var(--green); } .alert.err { color: var(--red); }
  </style>
</head>
<body>
  <h1>Washer #1 Status</h1>

  <div class="washer" id="washer">
    <div class="door"></div>
    <div class="glass"></div>
    <svg class="water" viewBox="0 0 172 172" aria-hidden="true">
      <!-- 60% of the circle, like .trim(from: 0, to: 0.6) -->
      <circle cx="86" cy="86" r="80" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="12"
              stroke-linecap="round" stroke-dasharray="301.6 502.7"/>
    </svg>
    <div class="readout">
      <div class="time" id="time">45:00</div>
      <div class="ai-tag">AI Adjusted ✨</div>
    </div>
  </div>

  <div class="panel">
    <div class="toggle-row">
      <label for="ai">✨ Smart Cycle Prediction</label>
      <input type="checkbox" class="switch" id="ai">
    </div>
    <p class="note">Uses local CoreML data to adjust the timer based on historical cycle delays for this specific machine model.</p>
  </div>

  <button class="btn btn-red" id="openReport">⚠︎ Report a Problem</button>

  <div class="backdrop" id="backdrop">
    <form class="sheet" id="reportForm" novalidate>
      <div class="grabber"></div>
      <div class="sheet-head">
        <h2>Report a Problem</h2>
        <button type="button" class="cancel" id="closeReport">Cancel</button>
      </div>

      <div class="section-label">Machine</div>
      <div class="group">Washer <span id="machineId">W4</span></div>

      <div class="section-label">What's wrong?</div>
      <div class="group">
        <select id="issue">
          <option>Won't start</option>
          <option>Leaking</option>
          <option>Won't drain</option>
          <option>Door stuck</option>
          <option>Other</option>
        </select>
      </div>

      <div class="section-label">Details</div>
      <div class="group">
        <textarea id="details" placeholder="Describe the problem (optional)" maxlength="600"></textarea>
        <div class="count"><span id="count">0</span>/500</div>
      </div>

      <button type="submit" class="send">Send to Maintenance</button>
      <div class="alert" id="alert" role="status"></div>
    </form>
  </div>

  <script>
    // ----- Washer timer (45:00 counting down, +5 min when Smart Cycle Prediction is on) -----
    const MAX_DETAILS = 500;
    let timeRemaining = 2700;
    const ai = document.getElementById("ai");

    function timeString(t) {
      return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
    }
    function render() {
      const shown = ai.checked ? timeRemaining + 300 : timeRemaining;
      document.getElementById("time").textContent = timeString(shown);
      document.getElementById("washer").classList.toggle("ai-on", ai.checked);
    }
    ai.addEventListener("change", render);
    setInterval(() => { timeRemaining = timeRemaining > 0 ? timeRemaining - 1 : 2700; render(); }, 1000);
    render();

    // ----- Report a Problem sheet -----
    const backdrop = document.getElementById("backdrop");
    const details = document.getElementById("details");
    const alertEl = document.getElementById("alert");

    function openSheet() { alertEl.textContent = ""; backdrop.classList.add("open"); }
    function closeSheet() { backdrop.classList.remove("open"); }
    document.getElementById("openReport").addEventListener("click", openSheet);
    document.getElementById("closeReport").addEventListener("click", closeSheet);
    backdrop.addEventListener("click", e => { if (e.target === backdrop) closeSheet(); });
    details.addEventListener("input", () => { document.getElementById("count").textContent = details.value.length; });

    // Same rules as validate() in WasherTimerView.swift
    function validate(r) {
      const id = r.machineID.trim(), d = r.details.trim();
      if (!id) return "Please enter the machine number.";
      if (id.length > 10) return "Machine number is too long.";
      if (r.issue === "Other" && !d) return "Please describe the problem.";
      if (d.length > MAX_DETAILS) return "Description is too long.";
      return null;
    }
    function showAlert(msg, ok) { alertEl.textContent = msg; alertEl.className = "alert " + (ok ? "ok" : "err"); }

    document.getElementById("reportForm").addEventListener("submit", async e => {
      e.preventDefault();
      const request = {
        machineID: document.getElementById("machineId").textContent,
        issue: document.getElementById("issue").value,
        details: details.value
      };
      const problem = validate(request);
      if (problem) return showAlert(problem, false);
      try {
        const res = await fetch("/reports", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(request)
        });
        const data = await res.json();
        if (!res.ok) return showAlert(data.error || "Couldn't send. Try again.", false);
        showAlert("Thanks! Maintenance has been notified.", true);
        details.value = ""; document.getElementById("count").textContent = "0";
        setTimeout(closeSheet, 1500);
      } catch {
        showAlert("Can't reach the server. Try again.", false);
      }
    });
  </script>
</body>
</html>
